<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Привет я тут, а ты?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #20202a;
      background: #f4f0ff;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { text-align: center; }
    .panel {
      margin: 28px auto;
      padding: 14px;
      max-width: 680px;
      background: #fff;
      border: 4px solid #20202a;
      border-radius: 12px;
      box-shadow: 8px 8px 0 #c7b5ff;
    }
    .panel img, .panel video {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #20202a;
      border-radius: 4px;
      background: #17151e;
    }
    .caption {
      margin: 14px 4px 4px;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }
    .video-note {
      margin: 10px 4px 4px;
      color: #5b5669;
      font-size: .92rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Привет я тут, а ты?</h1>
    <p>Второй коммит</p>
    <section class="panel" aria-label="Оживлённый первый кадр комикса">
      <video controls autoplay muted loop playsinline preload="metadata" poster="src/image/comic-01.jpg">
        <source src="src/video/video.mp4" type="video/mp4">
        Твой браузер не поддерживает видео HTML5.
      </video>
      <p class="caption">Кадр 1. История начинается…</p>
      <p class="video-note">Видео запускается без звука автоматически. Включи звук кнопкой плеера.</p>
    </section>
  </main>
</body>
</html>
